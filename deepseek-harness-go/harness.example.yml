# DeepSeek Harness Go 版 — example configuration
#
# 复制此文件为 harness.yml 并按需修改。任何敏感凭据（api-key）请通过
# 环境变量 DEEPSEEK_API_KEY 注入，绝不要写进仓库。

llm:
  base-url: <your-base-url>            # 例如 http://127.0.0.1:8777/v1
  api-key: ""                          # ❗ 不写在这里；用 env: DEEPSEEK_API_KEY
  model: <your-model>                  # 例如 glm-5.3-flash / deepseek-chat / gpt-4o-mini
  max-tokens: 8192
  timeout: 120s                        # 单次 LLM 调用超时

agent:
  max-rounds: 16                       # 单 turn ReAct 上限；超过则终止当前轮
  workspace: ./.dsh/workspace          # 启动时自动创建；fs_read/fs_write 锁在此目录内
  temperature: 0.2                     # 留空或不写则不发送 temperature 字段
  system-prompt: |                     # 可选；留空使用内置模板
    你是 dsh，一个简洁可靠的 CLI 助手。
  debug: false                         # true 时打印所有 agent 事件到 stderr

server:
  enabled: true
  listen: "127.0.0.1:8080"
  auth-token: "aBcD1234EfGh5678IjKl9012MnOp3456QrStUvWx="
  request-timeout: 30s          # 选填
  max-concurrent-sessions: 32   # 选填
# ---- DESIGN-v3 新增配置 ----

llm:
  # provider: openai     # openai | anthropic | ollama | gemini（§G.4）
                         # ollama 时 base-url 默认 http://127.0.0.1:11434
                         # gemini 时 api-key 走 DEEPSEEK_API_KEY 或此处的 api-key

skills:
  dir: ""                # skill 目录（§A.1）；空 = ~/.dsh/skills/*.md

obs:
  provider: noop         # noop | otel（§C.4）
  otel:
    endpoint: "localhost:4317"   # OTLP gRPC
    service-name: dsh
    sample-ratio: 1.0

compaction:
  enabled: false         # 长会话上下文压缩（§D.4）
  trigger-tokens: 16000
  strategy: truncate     # truncate | llm-summary
  keep-recent: 6

audit:
  path: ""               # 审计 JSONL 路径（§E）；空 = 关闭。CLI --audit 优先
  full: false            # true 记录 args 原文；false 只记 SHA-256 hash

sandbox:
  provider: noop         # noop | windows_acl | linux_ns | auto（§F.4）

shell:
  enabled: false         # 装配 shell 工具（DESIGN-v2 §C.3 + v3 §F.4）
  allowlist: []          # 允许的命令；空 = 拒绝一切
  timeout: 30s

# ---- DESIGN-v5 新增配置（可选；不写等价关闭） ----

channels:                # v5 P5-3：多 LLM 渠道注册表
  - code: primary        # 单条渠道的 code；-channel primary 切换
    provider: openai     # openai | anthropic | ollama | gemini
    base-url: <your-base-url>
    model: <your-model>

credentials:             # v5 P5-4：凭据来源
  file: ""               # JSON 文件路径（空 = 仅 env）

approval:                # v5 P5-5：审批矩阵
  matrix-path: ""        # YAML 文件路径（当前使用内置默认；空 = 关闭）

hooks:                   # v5 P5-6：工具执行钩子占位
  pre-tool-use: []
  post-tool-use: []
