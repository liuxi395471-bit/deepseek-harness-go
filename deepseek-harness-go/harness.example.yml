# DeepSeek Harness Go 版 — example configuration
#
# 复制此文件为 harness.yml 并按需修改。任何敏感凭据（api-key）请通过
# 环境变量 DEEPSEEK_API_KEY 注入，绝不要写进仓库。
#
# 加载优先级：默认值 → YAML → 环境变量（后者覆盖前者）。
# 完整的环境变量名见 README 的「配置项」一节。

llm:
  provider: "openai"                   # openai | anthropic | ollama | gemini
                                       # ollama 默认 http://127.0.0.1:11434
                                       # gemini 的 api-key 用 DEEPSEEK_API_KEY
  base-url: "http://127.0.0.1:8777/v1"  # OpenAI 兼容端点
  api-key: ""                          # ❗ 不写在这里；用 env: DEEPSEEK_API_KEY
  model: "glm-5.3-flash"               # 例如 deepseek-chat / gpt-4o-mini
  max-tokens: 8192
  timeout: 120s                        # 单次 LLM 调用超时

agent:
  max-rounds: 16                       # 单 turn ReAct 上限；超过则终止当前轮
  workspace: ./.dsh/workspace          # 启动时自动创建；fs_read/fs_write 锁在此目录内
  temperature: 0.2                     # 留空或不写则不发送 temperature 字段
  system-prompt: |                     # 可选；留空使用内置模板
    你是 dsh，一个简洁可靠的 CLI 助手。
  debug: false                         # true 时打印所有 agent 事件到 stderr

server:
  enabled: false                       # true 时可用 -serve 启动 HTTP+SSE 服务
  listen: "127.0.0.1:8080"
  auth-token: ""                       # enabled=true 时必填；建议用 DSH_SERVER_AUTH_TOKEN
  request-timeout: 30s                 # 选填
  max-concurrent-sessions: 32          # 选填

# ---- 以下为 v3 新增配置段 ----

skills:
  dir: ""                              # skill 目录；空 = ~/.dsh/skills/*.md

obs:
  provider: "noop"                     # noop | otel
  endpoint: "localhost:4317"           # otel 时使用；OTLP gRPC
  service-name: "dsh"                  # otel 时使用；resource.service.name
  sample-ratio: 1.0                    # otel 时使用；[0,1]，父采样优先

compaction:
  enabled: false                       # 长会话上下文压缩
  trigger-tokens: 16000                # 估算 token 超过此值触发
  strategy: "truncate"                 # truncate | llm-summary
  keep-recent: 6                       # 永远保留最近 N 条

audit:
  path: ""                             # 审计 JSONL 路径；空 = 关闭。CLI --audit 优先
  full: false                          # true 记录 args 原文；false 只记 SHA-256 hash

sandbox:
  provider: "noop"                     # noop | windows_acl | linux_ns | auto

shell:
  enabled: false                       # 装配 shell 工具
  allowlist: []                        # 允许的命令；空 = 拒绝一切
  timeout: 30s
